<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>'51 Legends — Vote</title>
    <link rel="icon" type="image/png" href="/nhra-75-logo-small.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking rendering: on a slow phone connection (or a
         network that blocks Google Fonts) a blocking stylesheet holds up the
         module scripts, and the ballot sits empty until it resolves. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400;1,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400;1,700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      :root {
        color-scheme: dark;
        --font: "Oswald", -apple-system, system-ui, sans-serif;
        --font-serif: "Playfair Display", Georgia, serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        --bg: #000000;
        --surface: rgba(255, 255, 255, 0.05);
        --surface-2: rgba(255, 255, 255, 0.09);
        --surface-3: rgba(255, 255, 255, 0.13);
        --accent: #e30613;
        --accent-2: #ff2a36;
        --accent-3: #ff8a91;
        --accent-glow: rgba(227, 6, 19, 0.35);
        --gold: #f5c542;
        --text: #fafafb;
        --text-2: #cdcdd6;
        --text-3: #a3a3b0;
        --text-4: #74747f;
        --r-lg: 18px;
        --r-md: 13px;
        --r-sm: 9px;
        --shadow-card: 0 1px 0 rgba(255, 255, 255, 0.06) inset,
          0 10px 26px rgba(0, 0, 0, 0.45);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f4f3f0;
        --surface: rgba(20, 20, 30, 0.05);
        --surface-2: rgba(20, 20, 30, 0.08);
        --surface-3: rgba(20, 20, 30, 0.12);
        --accent-glow: rgba(227, 6, 19, 0.2);
        --text: #17171c;
        --text-2: #3c3c46;
        --text-3: #5d5d68;
        --text-4: #8c8c96;
        --shadow-card: 0 1px 0 rgba(255, 255, 255, 0.7) inset,
          0 10px 26px rgba(20, 20, 30, 0.09);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font);
        background:
          radial-gradient(640px 300px at 50% -10%, var(--accent-glow), transparent 65%),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .widget {
        padding: 1.2rem clamp(0.9rem, 3vw, 2.2rem) 1.2rem;
        max-width: 100%;
        margin: 0 auto;
      }
      /* Set when the widget is in a frame that won't grow to fit it. The
         frame's own viewport can't scroll (embeds are often scrolling="no"),
         so the widget scrolls itself and nothing is stranded off the end. */
      html.frame-scroll,
      html.frame-scroll body {
        height: 100%;
        overflow: hidden;
      }
      html.frame-scroll .widget {
        height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      /* Header */
      .head {
        text-align: center;
        margin-bottom: 1rem;
      }
      .logo {
        max-height: 110px;
        max-width: 78%;
        width: auto;
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
        margin-bottom: 0.5rem;
      }
      .head h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .head h1 em {
        font-style: normal;
        color: var(--accent-2);
      }
      .head .div-line {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        font-family: var(--font-serif);
        font-style: italic;
        color: var(--text-3);
        font-size: 0.95rem;
        margin-top: 0.35rem;
      }
      .div-badge {
        height: 46px;
        width: auto;
        filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.5));
        display: none;
      }
      .photo-strip {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0.7rem 0 0.1rem;
        min-height: 0;
      }
      .photo-strip img {
        width: clamp(44px, 7vw, 60px);
        height: clamp(44px, 7vw, 60px);
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--bg);
        box-shadow: 0 0 0 2px var(--accent), 0 6px 16px rgba(0, 0, 0, 0.55);
        margin-left: -14px;
        transition: transform 0.15s ease;
      }
      .photo-strip img:first-child {
        margin-left: 0;
      }
      .photo-strip img:nth-child(odd) {
        transform: rotate(-4deg);
      }
      .photo-strip img:nth-child(even) {
        transform: rotate(4deg) translateY(3px);
      }
      .photo-strip img:hover {
        transform: scale(1.18);
        z-index: 2;
        position: relative;
      }
      .photo-strip .more {
        margin-left: 0.6rem;
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.1em;
        color: var(--text-4);
      }
      .rule {
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--accent) 25%, var(--accent) 75%, transparent);
        margin: 0.9rem 0;
      }
      /* Pick banner — carries the submit button so it is always reachable
         at the top, even in a frame that can't grow or scroll */
      .pick-banner {
        position: sticky;
        top: 0;
        z-index: 20;
        will-change: transform;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        background: linear-gradient(135deg, var(--accent-2), #b00d15);
        color: #fff;
        border-radius: var(--r-md);
        padding: 0.5rem 0.6rem 0.5rem 0.85rem;
        margin: 0 0 0.7rem;
        box-shadow: 0 8px 26px var(--accent-glow);
      }
      .pick-text {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.25rem 0.6rem;
        min-width: 0;
      }
      .pick-banner b {
        font-size: clamp(0.88rem, 3vw, 1.25rem);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        line-height: 1.1;
      }
      .pick-banner span {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        letter-spacing: 0.08em;
        background: rgba(0, 0, 0, 0.28);
        padding: 0.22rem 0.55rem;
        border-radius: 999px;
        white-space: nowrap;
      }
      .pick-submit {
        flex: none;
        font-family: var(--font);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.78rem;
        padding: 0.6rem 1rem;
        border: none;
        border-radius: 999px;
        background: #fff;
        color: #c00511;
        cursor: pointer;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
        transition: opacity 0.15s ease;
      }
      .pick-submit:disabled {
        opacity: 0.45;
        cursor: default;
      }
      @media (max-width: 430px) {
        .pick-banner {
          padding: 0.45rem 0.45rem 0.45rem 0.7rem;
          gap: 0.45rem;
          margin-bottom: 0.6rem;
        }
        .pick-text {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.12rem;
        }
        .pick-banner b {
          font-size: 0.86rem;
          letter-spacing: 0.05em;
        }
        .pick-banner span {
          font-size: 0.6rem;
          padding: 0.12rem 0.45rem;
        }
        .pick-submit {
          font-size: 0.72rem;
          padding: 0.55rem 0.85rem;
        }
      }
      #status {
        color: var(--text-2);
        font-size: 0.92rem;
        letter-spacing: 0.03em;
        min-height: 1.2em;
        margin: 0 0 0.85rem;
        text-align: center;
      }
      #status b {
        color: var(--accent-3);
        font-weight: 600;
      }
      /* Cards — square photo tiles in a responsive grid */
      #list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 28vw, 200px), 1fr));
        gap: 0.6rem;
      }
      .row {
        position: relative;
        aspect-ratio: 1 / 1;
        background: var(--surface);
        border-radius: var(--r-md);
        box-shadow: var(--shadow-card);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
      }
      .row:hover {
        transform: translateY(-2px);
      }
      .row::after {
        content: "";
        position: absolute;
        inset: 45% 0 0 0;
        background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.88));
        pointer-events: none;
      }
      .row.picked {
        box-shadow: inset 0 0 0 3px var(--accent), 0 0 22px var(--accent-glow),
          var(--shadow-card);
      }
      .avatar {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 2.2rem;
        color: var(--text-3);
        letter-spacing: 0.04em;
        background: var(--surface-3);
        overflow: hidden;
      }
      .avatar img.bg {
        position: absolute;
        inset: -8%;
        width: 116%;
        height: 116%;
        object-fit: cover;
        filter: blur(14px) saturate(1.05) brightness(0.65);
      }
      .avatar img.fg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 1;
      }
      .info {
        position: absolute;
        left: 0.6rem;
        right: 0.6rem;
        bottom: 0.55rem;
        z-index: 2;
      }
      /* Decorative accent bar, identical on every tile. Sits on the bottom
         edge rather than washing over the photo, and carries no vote
         information — tallies are admin-only. */
      .fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        pointer-events: none;
        z-index: 3;
      }
      /* The tile's place in the alphabetical list — not a ranking. */
      .list-num {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        z-index: 2;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 600;
        width: 1.6rem;
        height: 1.6rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.55);
        color: var(--text-2);
      }
      .name {
        font-weight: 600;
        font-size: 0.98rem;
        line-height: 1.15;
        letter-spacing: 0.02em;
        color: #fff;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
      }
      .meta {
        font-size: 0.66rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.75);
        margin-top: 0.15rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta .bio-link {
        color: var(--accent-3);
      }
      .pick-box {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        z-index: 2;
        width: 1.8rem;
        height: 1.8rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.55);
        color: transparent;
        font-weight: 700;
        font-size: 1rem;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .row.picked .pick-box {
        background: var(--accent);
        color: #fff;
      }
      .empty {
        grid-column: 1 / -1;
        color: var(--text-3);
        text-align: center;
        padding: 1.8rem 0;
        font-size: 0.9rem;
      }
      .choose {
        grid-column: 1 / -1;
      }
      .choose {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.45rem;
      }
      .choose a {
        font-weight: 600;
        letter-spacing: 0.08em;
        font-size: 0.85rem;
        text-decoration: none;
        color: #fff;
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        padding: 0.55rem 1rem;
        border-radius: var(--r-sm);
      }
      /* Second submit at the end of the list. Deliberately in normal flow:
         a floating bar is unreachable inside a frame that can't scroll or
         grow, which is why the banner at the top carries a submit too. */
      .submit-bar {
        display: flex;
        justify-content: center;
        padding: 0.7rem 0 calc(0.7rem + env(safe-area-inset-bottom));
        margin-top: 0.8rem;
      }
      .submit-btn {
        width: min(92%, 420px);
        font-family: var(--font);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 1rem;
        padding: 1rem 1.5rem;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        color: #fff;
        cursor: pointer;
        box-shadow: 0 6px 24px var(--accent-glow), 0 0 0 2px rgba(255, 255, 255, 0.15) inset;
        transition: filter 0.15s ease, opacity 0.15s ease;
      }
      .submit-btn:hover:not(:disabled) {
        filter: brightness(1.12);
      }
      .submit-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      /* Bio overlay */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        display: grid;
        place-items: center;
        padding: 1.2rem;
        z-index: 50;
      }
      .bio-card {
        background: #121216;
        border-radius: var(--r-lg);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 24px 60px rgba(0, 0, 0, 0.6);
        max-width: 26rem;
        width: 100%;
        max-height: 80vh;
        overflow-y: auto;
        padding: 1.2rem 1.2rem 1.3rem;
        color: #fafafb;
      }
      .bio-card img {
        width: 100%;
        max-height: 15rem;
        object-fit: cover;
        object-position: center 18%;
        border-radius: var(--r-md);
        margin-bottom: 0.8rem;
      }
      .bio-card .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(4.2rem, 1fr));
        gap: 0.4rem;
        margin: -0.3rem 0 0.8rem;
      }
      .bio-card .photo-grid img {
        width: 100%;
        height: 4.2rem;
        object-fit: cover;
        border-radius: var(--r-sm);
        margin: 0;
        cursor: pointer;
      }
      .bio-card h3 {
        margin: 0 0 0.15rem;
        font-size: 1.25rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .bio-card .cat {
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent-3);
        margin-bottom: 0.6rem;
      }
      .bio-card p {
        font-family: var(--font-serif);
        line-height: 1.55;
        color: #cdcdd6;
        margin: 0 0 1rem;
        white-space: pre-wrap;
      }
      .bio-card button {
        font-family: var(--font);
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.78rem;
        padding: 0.55rem 1.4rem;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .bio-page {
        max-width: 42rem;
        margin: 0 auto;
      }
      .bio-page .back-btn,
      .voter-page .back-btn {
        font-family: var(--font);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.8rem;
        padding: 0.65rem 1.4rem;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        color: #fff;
        cursor: pointer;
        margin: 0.4rem 0 0.9rem;
      }
      .bio-page img.main {
        width: 100%;
        max-height: 62vh;
        object-fit: contain;
        background: rgba(0, 0, 0, 0.45);
        border-radius: var(--r-md);
        margin-bottom: 0.7rem;
      }
      .bio-page .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(4.2rem, 1fr));
        gap: 0.4rem;
        margin-bottom: 0.8rem;
      }
      .bio-page .photo-grid img {
        width: 100%;
        height: 4.2rem;
        object-fit: cover;
        border-radius: var(--r-sm);
        cursor: pointer;
      }
      .bio-page h3 {
        margin: 0 0 0.15rem;
        font-size: 1.4rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .bio-page .cat {
        font-size: 0.74rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent-3);
        margin-bottom: 0.7rem;
      }
      .bio-page p.bio-text {
        font-family: var(--font-serif);
        font-size: 1.02rem;
        line-height: 1.6;
        color: var(--text-2);
        margin: 0 0 1.2rem;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
      /* Confirm step — name + email before the ballot counts */
      .voter-page {
        max-width: 30rem;
        margin: 0 auto;
      }
      .voter-page h3 {
        margin: 0.2rem 0 0.3rem;
        font-size: 1.35rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .voter-page .note {
        font-family: var(--font-serif);
        font-size: 0.92rem;
        line-height: 1.5;
        color: var(--text-3);
        margin: 0 0 1rem;
      }
      .voter-page ol {
        list-style: none;
        counter-reset: pick;
        margin: 0 0 1.1rem;
        padding: 0;
        display: grid;
        gap: 0.35rem;
      }
      .voter-page ol li {
        counter-increment: pick;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        background: var(--surface);
        border-radius: var(--r-sm);
        padding: 0.5rem 0.7rem;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
      }
      .voter-page ol li::before {
        content: counter(pick);
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 700;
        width: 1.5rem;
        height: 1.5rem;
        flex: none;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #fff;
      }
      .voter-page label {
        display: block;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-3);
        margin: 0 0 0.3rem;
      }
      .voter-page input {
        width: 100%;
        font-family: var(--font);
        font-size: 1.05rem;
        color: var(--text);
        background: var(--surface-2);
        border: 2px solid transparent;
        border-radius: var(--r-sm);
        padding: 0.8rem 0.9rem;
        margin-bottom: 0.9rem;
      }
      .voter-page input:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--surface-3);
      }
      .voter-page .err {
        color: var(--accent-3);
        font-size: 0.9rem;
        margin: 0 0 0.8rem;
      }
      .voter-page .submit-btn {
        width: 100%;
        margin-bottom: 0.6rem;
      }
      .foot {
        margin-top: 1rem;
        font-size: 0.6rem;
        color: var(--text-4);
        text-align: center;
        font-family: var(--font-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="widget">
      <div class="head">
        <img class="logo" id="logo" src="/nhra-75-logo.png" alt="'51 Legends" />
        <h1>Vote for the <em>'51 Legends</em></h1>
        <div class="div-line" id="div-line-wrap">
          <img class="div-badge" id="div-badge" alt="" />
          <span id="div-line">&nbsp;</span>
        </div>
        <div class="photo-strip" id="photo-strip"></div>
      </div>
      <div class="rule"></div>
      <div class="pick-banner hidden" id="pick-banner">
        <div class="pick-text">
          <b>Pick your top 5 legends</b>
          <span id="pick-count">0 of 5 selected</span>
        </div>
        <button class="pick-submit" id="submit-top" disabled>Submit</button>
      </div>
      <p id="status">Loading…</p>
      <ul id="list"></ul>
      <div class="bio-page hidden" id="bio-page"></div>
      <div class="voter-page hidden" id="voter-page">
        <button class="back-btn" id="voter-back">← Back to my picks</button>
        <h3>Confirm your ballot</h3>
        <p class="note">
          One ballot per person. Your name and email are only used to make
          sure everyone votes once — they are never shown with the results.
        </p>
        <ol id="picks-list"></ol>
        <label for="voter-name">Your name</label>
        <input
          id="voter-name"
          type="text"
          autocomplete="name"
          placeholder="First and last name"
        />
        <label for="voter-email">Your email</label>
        <input
          id="voter-email"
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="you@example.com"
        />
