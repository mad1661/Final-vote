<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legend Vote — Admin</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --bg-card: #151924;
        --bg-card-hover: #1b2130;
        --border: #262d3d;
        --text: #eef1f7;
        --text-dim: #96a0b5;
        --accent: #e8342a;
        --accent-2: #ff7a3d;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(1100px 500px at 50% -10%, #1c2233 0%, transparent 60%),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .wrap {
        max-width: 46rem;
        margin: 0 auto;
        padding: 0 1rem 4rem;
      }
      header {
        text-align: center;
        padding: 3rem 0 1.5rem;
      }
      .kicker {
        display: inline-block;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--accent-2);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.35rem 1rem;
        margin-bottom: 1rem;
        background: rgba(232, 52, 42, 0.08);
      }
      h1 {
        font-size: clamp(2rem, 6vw, 2.8rem);
        margin: 0;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        background: linear-gradient(180deg, #fff 30%, #b9c2d6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #status {
        text-align: center;
        color: var(--text-dim);
        min-height: 1.3em;
      }
      section {
        margin-top: 2rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.25rem;
      }
      h2 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-dim);
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      .btn {
        font-weight: 700;
        padding: 0.6rem 1.2rem;
        border: none;
        border-radius: 0.6rem;
        background: linear-gradient(135deg, var(--accent), #c31f16);
        color: #fff;
        cursor: pointer;
      }
      .btn:hover {
        filter: brightness(1.15);
      }
      .btn.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn.secondary:hover {
        background: var(--bg-card-hover);
        filter: none;
      }
      .btn.danger {
        background: transparent;
        color: #ff6b61;
        border: 1px solid #7a2822;
        padding: 0.25rem 0.7rem;
        font-size: 0.8rem;
      }
      .btn.danger:hover {
        background: rgba(232, 52, 42, 0.12);
        filter: none;
      }
      #bulk-input {
        width: 100%;
        min-height: 8rem;
        padding: 0.7rem;
        border: 1px solid var(--border);
        border-radius: 0.6rem;
        background: var(--bg);
        color: var(--text);
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 0.6rem;
      }
      #bulk-status {
        color: var(--text-dim);
        margin: 0.6rem 0 0;
        min-height: 1.2em;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 0.5rem 0.4rem;
        border-bottom: 1px solid var(--border);
      }
      th {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
      }
      th:last-child,
      td:last-child {
        text-align: right;
      }
      .hidden {
        display: none;
      }
      #signed-in-as {
        font-size: 0.9rem;
        color: var(--text-dim);
      }
      #auth-section {
        text-align: center;
        padding: 2rem 1.25rem;
      }
      #count-line {
        color: var(--text-dim);
        margin: 0 0 0.5rem;
      }
      a.back {
        color: var(--text-dim);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <span class="kicker">Admin</span>
        <h1>Legend Vote</h1>
      </header>
      <p id="status">Loading…</p>

      <section id="auth-section">
        <button id="sign-in" class="btn">Sign in with Google</button>
      </section>

      <div id="admin-ui" class="hidden">
        <div class="row" style="justify-content: space-between">
          <span id="signed-in-as"></span>
          <span class="row" style="margin: 0">
            <a class="back" href="/">← View vote page</a>
            <button id="sign-out" class="btn secondary">Sign out</button>
          </span>
        </div>

        <section>
          <h2>Bulk add names</h2>
          <p style="margin-top: 0; color: var(--text-dim)">
            Paste names below — one per line (commas also work) — or upload a
            spreadsheet.
          </p>
          <textarea
            id="bulk-input"
            placeholder="Jane Smith&#10;John Doe&#10;…"
          ></textarea>
          <div class="row">
            <button id="add-pasted" class="btn">Add pasted names</button>
            <label class="btn secondary" for="file-input" style="cursor: pointer">
              Upload Excel / CSV
            </label>
            <input
              id="file-input"
              type="file"
              accept=".xlsx,.xls,.csv"
              class="hidden"
            />
          </div>
          <p id="bulk-status"></p>
        </section>

        <section>
          <h2>Current names</h2>
          <p id="count-line"></p>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Votes</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="names-body"></tbody>
          </table>
        </section>
      </div>
    </div>
    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
